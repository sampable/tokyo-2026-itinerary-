<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用旅行準備 Check List (Generic Travel Checklist)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            background-color: #ffffff;
            color: var(--primary-color);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
            margin-right: 8px;
        }

        header {
            text-align: center;
            padding: 10px 0 25px;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 0.95rem;
        }

        .progress-card {
            background-color: #e8f4ea;
            border: 1px solid #c3e6cb;
            border-radius: var(--border-radius);
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-title {
            color: #155724;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .progress-count {
            background-color: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .checklist-group {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #eef2f5;
        }

        .group-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f3f5;
        }

        .checklist-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px dashed #e9ecef;
            cursor: pointer;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item input[type="checkbox"] {
            margin-top: 4px;
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #28a745;
        }

        .item-text {
            flex-grow: 1;
        }

        .item-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-color);
        }

        .item-desc {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 2px;
        }

        .checklist-item input:checked + .item-text .item-title {
            text-decoration: line-through;
            color: #adb5bd;
        }

        .note-badge {
            display: inline-block;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: 500;
        }

        .badge-red { background-color: #f8d7da; color: #721c24; }
        .badge-yellow { background-color: #fff3cd; color: #856404; }
        .badge-blue { background-color: #cce5ff; color: #004085; }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            color: #adb5bd;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-btn">🗺️ 8日行程表</a>
    <a href="checklist.html" class="nav-btn">📝 行程專屬預約 Check List</a>

    <header>
        <h1>🧳 通用旅行打包與行前 Check List</h1>
        <div class="subtitle">通用隨身物品、衣物、個人護理與行前確認清單</div>
    </header>

    <div class="progress-card">
        <span class="progress-title">🎯 通用準備完成進度</span>
        <span class="progress-count" id="progress-bar">0 / 20</span>
    </div>

    <!-- 1. 重要證件與財務 -->
    <div class="checklist-group">
        <div class="group-title">📄 1. 重要證件與財務（隨身攜帶）</div>
        
        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_1">
            <div class="item-text">
                <div class="item-title">特區護照正本</div>
                <div class="item-desc">確認有效期 6 個月以上；免稅必備</div>
                <span class="note-badge badge-red">切勿寄艙</span>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_2">
            <div class="item-text">
                <div class="item-title">香港身份證</div>
                <div class="item-desc">出入境與備用證明</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_3">
            <div class="item-text">
                <div class="item-title">日圓現金 & 外幣信用卡</div>
                <div class="item-desc">備 1-2 張海外簽賬高回贈 / 感應支付信用卡</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_4">
            <div class="item-text">
                <div class="item-title">機票 / 酒店 / 旅遊保險單據</div>
                <div class="item-desc">紙本或手機 PDF 離線備份</div>
            </div>
        </label>
    </div>

    <!-- 2. 電子與通訊用品 -->
    <div class="checklist-group">
        <div class="group-title">📱 2. 電子與通訊用品</div>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_5">
            <div class="item-text">
                <div class="item-title">手機 & 日本網卡 (eSIM / 實體卡 / Wi-Fi 蛋)</div>
                <div class="item-desc">出發前確認啟用方式與設定</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_6">
            <div class="item-text">
                <div class="item-title">流動充電寶 (Power Bank)</div>
                <div class="item-desc">必須隨身攜帶，嚴禁放進寄艙行李</div>
                <span class="note-badge badge-red">必須隨身</span>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_7">
            <div class="item-text">
                <div class="item-title">充電線、充電頭 & 轉換插頭</div>
                <div class="item-desc">Type-C / Lightning 線；日本為兩腳扁孔 A 型</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_8">
            <div class="item-text">
                <div class="item-title">降噪耳機</div>
                <div class="item-desc">搭機與搭車時使用</div>
            </div>
        </label>
    </div>

    <!-- 3. 隨身背包與裝備 -->
    <div class="checklist-group">
        <div class="group-title">🎒 3. 隨身背包與裝備</div>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_9">
            <div class="item-text">
                <div class="item-title">輕便隨身小包 / 斜揹袋</div>
                <div class="item-desc">方便逛街裝護照、銀包、手機</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_10">
            <div class="item-text">
                <div class="item-title">環保購物袋</div>
                <div class="item-desc">日本膠袋需收費，隨身帶備極實用</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_11">
            <div class="item-text">
                <div class="item-title">摺疊雨傘 / 保溫水樽</div>
                <div class="item-desc">應付天氣變化與隨時補充水分</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_12">
            <div class="item-text">
                <div class="item-title">紙巾、濕紙巾 & 消毒搓手液</div>
                <div class="item-desc">日常個人衛生備用</div>
            </div>
        </label>
    </div>

    <!-- 4. 衣物與鞋履 -->
    <div class="checklist-group">
        <div class="group-title">👕 4. 衣物與鞋履</div>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_13">
            <div class="item-text">
                <div class="item-title">防風外套 / 保暖衣物（洋蔥式穿搭）</div>
                <div class="item-desc">應付日本秋末冬初早晚溫差</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_14">
            <div class="item-text">
                <div class="item-title">換洗衣物、內衣褲 & 襪子</div>
                <div class="item-desc">按天數準備，預留行李空間放戰利品</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_15">
            <div class="item-text">
                <div class="item-title">極好行路的步行鞋 / 運動鞋</div>
                <div class="item-desc">市內每日步行步數多，舒服最重要</div>
                <span class="note-badge badge-blue">行路必備</span>
            </div>
        </label>
    </div>

    <!-- 5. 個人護理與常備藥物 -->
    <div class="checklist-group">
        <div class="group-title">💊 5. 個人護理與常備藥物</div>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_16">
            <div class="item-text">
                <div class="item-title">個人護膚品、保濕乳液 & 潤唇膏</div>
                <div class="item-desc">日本天氣較乾燥，保濕必備</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_17">
            <div class="item-text">
                <div class="item-title">個人盥洗用品（牙刷、牙膏、洗面乳）</div>
                <div class="item-desc">部分環保酒店不主動提供，建議自備</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_18">
            <div class="item-text">
                <div class="item-title">常備個人藥物 & 貼布</div>
                <div class="item-desc">止痛藥、腸胃藥、暈浪丸、膠布、鎮痛貼布</div>
            </div>
        </label>
    </div>

    <!-- 6. 行前最後確認 -->
    <div class="checklist-group">
        <div class="group-title">💡 6. 出發前最後確認</div>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_19">
            <div class="item-text">
                <div class="item-title">Visit Japan Web 入境申報完成</div>
                <div class="item-desc">確認填妥並儲存 QR Code 至手機</div>
            </div>
        </label>

        <label class="checklist-item">
            <input type="checkbox" onchange="updateProgress()" id="gen_20">
            <div class="item-text">
                <div class="item-title">預留行李篋空間與重量確認</div>
                <div class="item-desc">確保行李沒有違禁品，隨身帶 Power Bank</div>
            </div>
        </label>
    </div>

    <footer>
        <p>© 2026 Tokyo Family Itinerary | Powered by GitHub Pages</p>
    </footer>
</div>

<script>
    function updateProgress() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        let checkedCount = 0;
        checkboxes.forEach((chk) => {
            if (chk.checked) {
                checkedCount++;
                localStorage.setItem(chk.id, 'true');
            } else {
                localStorage.setItem(chk.id, 'false');
            }
        });
        document.getElementById('progress-bar').innerText = `${checkedCount} / ${checkboxes.length}`;
    }

    // 載入時復原狀態
    window.addEventListener('DOMContentLoaded', () => {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((chk) => {
            const saved = localStorage.getItem(chk.id);
            if (saved === 'true') {
                chk.checked = true;
            }
        });
        updateProgress();
    });
</script>

</body>
</html>
